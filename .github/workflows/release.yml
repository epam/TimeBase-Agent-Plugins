name: Release

"on":
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  CLAUDE_CODE_VERSION: '2.1.280'
  VALLY_VERSION: '0.12.0'
  CURSOR_VALIDATOR_REV: '46216072ac5750f782f95bb325b4d12b7c3ae9c9'

jobs:
  build:
    name: Validate and package skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Verify release source
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases must be dispatched from the main branch; got ${GITHUB_REF}."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          manifests = [
              Path(".claude-plugin/plugin.json"),
              Path(".codex-plugin/plugin.json"),
              Path(".cursor-plugin/plugin.json"),
              Path(".plugin/plugin.json"),
              Path("gemini-extension.json"),
          ]
          versions = {str(path): json.loads(path.read_text())["version"] for path in manifests}
          version = versions[str(manifests[0])]
          if len(set(versions.values())) != 1:
              raise SystemExit(f"Plugin versions disagree: {versions}")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?", version):
              raise SystemExit(f"Invalid release version: {version!r}")
          print(f"v{version}")
          PY
          )

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists. Bump the version before releasing."
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${tag} already exists. Bump the version before releasing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install validators
        id: validators
        run: |
          npm install --global --prefix "${RUNNER_TEMP}/validators" \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
            "@microsoft/vally-cli@${VALLY_VERSION}"
          echo "${RUNNER_TEMP}/validators/bin" >> "${GITHUB_PATH}"
          node --version
          "${RUNNER_TEMP}/validators/bin/claude" --version
          "${RUNNER_TEMP}/validators/bin/vally" --version

      - name: Prepare Cursor validator
        id: upstream-validators
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://raw.githubusercontent.com/cursor/plugin-template/${CURSOR_VALIDATOR_REV}/scripts/validate-template.mjs" \
            --output "${RUNNER_TEMP}/validators/validate-template.mjs"

      - name: Validate Cursor plugin and marketplace
        id: cursor
        run: node "${RUNNER_TEMP}/validators/validate-template.mjs"

      - name: Validate Claude Code plugin manifest
        id: claude-plugin
        run: claude plugin validate .claude-plugin/plugin.json

      - name: Validate Claude Code marketplace manifest
        id: claude-marketplace
        run: claude plugin validate .claude-plugin/marketplace.json

      - name: Validate Claude Code skills
        id: claude-skills
        run: claude plugin validate skills

      - name: Validate skill metadata and references with Vally
        id: vally
        run: vally lint ./skills --verbose

      - name: Summarize validation
        if: always()
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          ## Release validation

          Configured versions: Node.js ${{ env.NODE_VERSION }}, Claude Code ${{ env.CLAUDE_CODE_VERSION }}, Vally CLI ${{ env.VALLY_VERSION }}, Cursor validator script `${{ env.CURSOR_VALIDATOR_REV }}`.

          | Check | Result |
          | --- | --- |
          | Release version | ${{ steps.version.outcome }} |
          | Validator installation | ${{ steps.validators.outcome }} |
          | Validator script setup | ${{ steps.upstream-validators.outcome }} |
          | Cursor plugin and marketplace | ${{ steps.cursor.outcome }} |
          | Claude Code plugin manifest | ${{ steps.claude-plugin.outcome }} |
          | Claude Code marketplace manifest | ${{ steps.claude-marketplace.outcome }} |
          | Claude Code skills | ${{ steps.claude-skills.outcome }} |
          | Vally skill metadata and references | ${{ steps.vally.outcome }} |

          EOF

      - name: Package skills
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for skill in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$skill")")
            git archive --format=zip --prefix="$name/" --output="dist/$name.zip" "HEAD:skills/$name"
            unzip -tq "dist/$name.zip"
            unzip -p "dist/$name.zip" "$name/SKILL.md" >/dev/null
          done

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist/

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(
            "--repo=${GITHUB_REPOSITORY}"
            "--target=${GITHUB_SHA}"
            "--generate-notes"
            "--title=${TAG}"
            "--draft"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=("--prerelease" "--latest=false")
          fi
          gh release create "${TAG}" "${args[@]}" dist/*.zip
